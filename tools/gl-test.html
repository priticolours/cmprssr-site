<!doctype html>
<!-- Contact sheet for the fp motion piece: every phase of the 7s loop,
     drawn into one tall canvas row by row. Development only.

     Served over http (not file://) because gl.js fetches the fp mesh
     and fetch() is blocked on the file: origin. -->
<html>
<head>
<meta charset="utf-8">
<title>cmprssr 3D contact sheet</title>
<style>
  body { margin:0; background:#0b131a; }
  /* a grid, so the whole loop reads at once instead of as a strip */
  #wrap { display:grid; grid-template-columns:repeat(4,340px); gap:8px;
          padding:8px; }
  figure { margin:0; }
  figcaption { color:#5f7b8e; font:10px ui-monospace,monospace;
               text-align:center; padding-top:2px; }
  canvas { display:block; width:340px; height:340px; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="../gl.js"></script>
<script>
(async () => {
  /* sampled across the new 9s loop: logo, assemble, hold, teardown,
     dissolve, cloud, condense, logo */
  const TIMES = [0.3, 1.2, 2.0, 2.9, 3.6, 4.2, 4.6, 5.0, 5.5, 6.0, 6.5, 8.6];
  const wrap = document.getElementById("wrap");
  const scenes = [];
  const canvases = TIMES.map((t) => {
    const fig = document.createElement("figure");
    const c = document.createElement("canvas");
    const cap = document.createElement("figcaption");
    cap.textContent = "t=" + t.toFixed(1) + "s";
    fig.appendChild(c); fig.appendChild(cap);
    wrap.appendChild(fig);
    return c;
  });

  window.__ok = false;
  window.__err = null;
  try {
    const first = await window.CMPRSSR3D.create(canvases[0], { count: 150000, preserve: true });
    window.__ok = !!(first && first.ok);
    for (let i = 0; i < TIMES.length; i++) {
      const scene = i === 0 ? first
        : await window.CMPRSSR3D.create(canvases[i], { count: 150000, preserve: true });
      scenes.push(scene);
    }
    /* draw only once the grid has laid out: draw() sizes the drawing
       buffer from clientWidth, and a canvas with no layout is a no-op */
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    for (let i = 0; i < TIMES.length; i++) scenes[i].draw(TIMES[i]);
    await new Promise(r => requestAnimationFrame(() => r()));
  } catch (e) {
    window.__err = String(e && e.message || e);
  }
  window.__ready = true;
})();
</script>
</body>
</html>
